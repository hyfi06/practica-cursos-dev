<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust blog</title>
  </head>
  <body>
    {% for post in posts %}
    <div>
      <a href="/blog/{{post.slug}}"><h1>{{ post.title }}</h1></a>
      <p>{{ post.body | truncate(length = 15, end = "...")}}</p>
    </div>
    {% endfor %}
  </body>
</html>
